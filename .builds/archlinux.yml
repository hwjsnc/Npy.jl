# build manifest for sr.ht
image: archlinux
packages:
 - gnupg
 - julia
 - python-numpy
sources:
 - https://git.sr.ht/~quf/Npy.jl
tasks:
 - check-signature-if-on-trunk: |
    cd Npy.jl
    gpg --import .builds/signing-keys.asc # Import keys
    gpg --list-keys | grep '^    ' | sed 's/^ *//' | sed 's/$/:6:/' | gpg --import-ownertrust # Set trust to ultimate
    if test $(git rev-parse HEAD) = $(git rev-parse trunk); then
      git verify-commit HEAD # Every commit on trunk should be signed
    fi
 - run-tests-current: |
    cd Npy.jl
    julia --project=. -e 'import Pkg; Pkg.test()'
 - download-lts: |
    gpg --import - < Npy.jl/.builds/juliareleases.asc
    curl -o julia-1.0.5-linux-x86_64.tar.gz 'https://julialang-s3.julialang.org/bin/linux/x64/1.0/julia-1.0.5-linux-x86_64.tar.gz'
    curl 'https://julialang-s3.julialang.org/bin/linux/x64/1.0/julia-1.0.5-linux-x86_64.tar.gz.asc' | gpg --verify --trust-model always - julia-1.0.5-linux-x86_64.tar.gz
    tar xzf julia-1.0.5-linux-x86_64.tar.gz
 - run-tests-lts: |
    cd Npy.jl
    $HOME/julia-1.0.5/bin/julia --project=. -e 'import Pkg; Pkg.test()'
